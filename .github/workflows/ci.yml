name: Continuous Integration

on:
  push:
    branches:
      - frontend
      - main
  pull_request:
    branches:
      - frontend
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run backend unit tests
        run: npm run test:unit --prefix backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_flowdesk_production_grade_minimum_32_chars
          PORT: 5000

      - name: Run Atlas integration tests (when secret available)
        if: ${{ env.HAS_MONGODB == 'true' }}
        run: npm run test:integration --prefix backend
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ci_test_jwt_secret_flowdesk_production_grade_minimum_32_chars
          HAS_MONGODB: ${{ secrets.MONGODB_URI != '' }}

  frontend-ci:
    name: Frontend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm run test --prefix frontend

      - name: Build frontend production bundle
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: /api

      - name: Verify build artifacts
        run: |
          test -f frontend/dist/index.html || exit 1
          echo "Frontend production build verified successfully."
